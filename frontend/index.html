<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Monitor</title>
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <meta name="theme-color" content="#FCFBF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090D0D" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) || location.search.indexOf('theme=dark') >= 0) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
